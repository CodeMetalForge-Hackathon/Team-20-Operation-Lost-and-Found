# Nav2 parameters for the GHOST mecanum base (holonomic, ~0.25 × 0.2 m).
#
# No global map: both costmaps are rolling windows in the odom frame, fed by
# the depth camera's point cloud.  GHOST picks goals; Nav2 only has to get
# there without hitting anything.  Speeds are deliberately low — raise
# vx_max / vy_max / wz_max once the base is tuned.
#
# Recent Nav2 publishes TwistStamped on /cmd_vel (enable_stamped_cmd_vel).
# On Humble that parameter doesn't exist: run base_driver.py --unstamped.

bt_navigator:
  ros__parameters:
    global_frame: odom
    robot_base_frame: base_link
    odom_topic: /visual_slam/tracking/odometry
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    navigators: ["navigate_to_pose"]
    # Forward-camera-safe tree: no BackUp, no costmap wiping (see the XML).
    default_nav_to_pose_bt_xml: /workspaces/isaac_ros-dev/ghost/jetson/config/bt_nav_to_pose_forward_camera.xml
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

controller_server:
  ros__parameters:
    controller_frequency: 15.0
    enable_stamped_cmd_vel: true
    odom_topic: /visual_slam/tracking/odometry
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 15.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 6.28        # any heading — GHOST only cares where the robot is
      stateful: true
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 40
      model_dt: 0.067
      batch_size: 1000
      iteration_count: 1
      # DiffDrive although the base CAN strafe: the only obstacle sensor is a
      # forward depth camera (~90 deg), so the robot must always move where it
      # is looking. As Omni (strafe/reverse allowed) it moved sideways and
      # backwards into things it could not see, and bumped them.
      motion_model: "DiffDrive"
      DiffDrive:                     # Nav2 Kilted+: motion models are plugins
        plugin: "mppi::DiffDriveMotionModel"
      vx_max: 0.30
      vx_min: 0.0                    # never reverse: nothing sees behind
      vy_max: 0.0
      wz_max: 1.2
      ax_max: 0.6
      ax_min: -0.6
      ay_max: 0.6
      az_max: 2.0
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      temperature: 0.3
      gamma: 0.015
      visualize: false
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "PathAlignCritic",
                "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      CostCritic:
        consider_footprint: true      # check the rectangle, not just the centre (narrow robot)
        cost_weight: 3.81
        critical_cost: 300.0
        collision_cost: 1000000.0
        near_goal_distance: 0.5
      PathAngleCritic:
        mode: 0                       # face along the path (camera looks where it drives)

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.3
      use_astar: true
      allow_unknown: true             # rolling window: most of the world is unknown

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    enable_stamped_cmd_vel: true
    behavior_plugins: ["spin", "wait"]   # no backup: it drives blind
    spin:
      plugin: "nav2_behaviors::Spin"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 1.5
    max_rotational_vel: 0.8
    min_rotational_vel: 0.3
    rotational_acc_lim: 2.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 8.0
      publish_frequency: 4.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # robot is 30 cm long x 22 cm wide, base_link at its centre; +1 cm all round
      footprint: "[[0.15, 0.11], [0.15, -0.11], [-0.15, -0.11], [-0.15, 0.11]]"
      footprint_padding: 0.01
      transform_tolerance: 0.3
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        # Heights are in the odom frame, whose z = 0 plane is base_link's start
        # plane (cuVSLAM base_frame = base_link, ground-constrained). The floor
        # is at z = -0.004 and the camera at +0.143. Grid: -0.20 .. +0.60
        # (16 x 5 cm); the camera must sit inside it or obstacles never clear.
        origin_z: -0.20
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 0.60
        mark_threshold: 0
        # jetson/obstacle_filter.py removes the floor in the ROBOT frame and
        # gates far points on ego-motion, so the odom-height cut here is only
        # the voxel grid's bottom: odometry drift can no longer turn the floor
        # into obstacles. Marking and clearing come from separate clouds.
        observation_sources: obstacles clearing
        obstacles:
          topic: /camera/obstacle_points
          data_type: "PointCloud2"
          sensor_frame: camera_link
          min_obstacle_height: -0.19
          max_obstacle_height: 0.60     # top of the voxel grid, ~0.6 m above the floor
          obstacle_max_range: 3.0
          marking: true
          clearing: false
          expected_update_rate: 0.0
        clearing:
          topic: /camera/clearing_points  # all points incl. floor, 10 cm voxels
          data_type: "PointCloud2"
          sensor_frame: camera_link
          min_obstacle_height: -0.19    # keep floor endpoints so rays reach them
          max_obstacle_height: 0.60
          raytrace_max_range: 3.5
          marking: false
          clearing: true
          expected_update_rate: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.35
        cost_scaling_factor: 4.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true            # no static map
      width: 20
      height: 20
      resolution: 0.05
      # robot is 30 cm long x 22 cm wide, base_link at its centre; +1 cm all round
      footprint: "[[0.15, 0.11], [0.15, -0.11], [-0.15, -0.11], [-0.15, 0.11]]"
      footprint_padding: 0.01
      track_unknown_space: true
      transform_tolerance: 0.3
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        # Heights are in the odom frame, whose z = 0 plane is base_link's start
        # plane (cuVSLAM base_frame = base_link, ground-constrained). The floor
        # is at z = -0.004 and the camera at +0.143. Grid: -0.20 .. +0.60
        # (16 x 5 cm); the camera must sit inside it or obstacles never clear.
        origin_z: -0.20
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 0.60
        mark_threshold: 0
        # jetson/obstacle_filter.py removes the floor in the ROBOT frame and
        # gates far points on ego-motion, so the odom-height cut here is only
        # the voxel grid's bottom: odometry drift can no longer turn the floor
        # into obstacles. Marking and clearing come from separate clouds.
        observation_sources: obstacles clearing
        obstacles:
          topic: /camera/obstacle_points
          data_type: "PointCloud2"
          sensor_frame: camera_link
          min_obstacle_height: -0.19
          max_obstacle_height: 0.60     # top of the voxel grid, ~0.6 m above the floor
          obstacle_max_range: 3.0
          marking: true
          clearing: false
          expected_update_rate: 0.0
        clearing:
          topic: /camera/clearing_points  # all points incl. floor, 10 cm voxels
          data_type: "PointCloud2"
          sensor_frame: camera_link
          min_obstacle_height: -0.19    # keep floor endpoints so rays reach them
          max_obstacle_height: 0.60
          raytrace_max_range: 3.5
          marking: false
          clearing: true
          expected_update_rate: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.35
        cost_scaling_factor: 4.0
      always_send_full_costmap: true

# Collision Monitor: last word on velocity. Nav2's controller and behaviours
# publish /cmd_vel_nav; this node passes it on to /cmd_vel (the base driver)
# after checking the RAW floor-free candidates from obstacle_filter.py, so it
# reacts at once to anything near, confirmed or not.
#   SlowZone:      anything within 0.6 m of the robot centre → half speed
#   FootprintApproach: limits speed so the robot circle (r 0.18 m) would not
#                  touch any point within 1.2 s; moving AWAY is never blocked,
#                  so it can't trap the robot against a wall like a stop zone.
# If the source goes quiet for source_timeout, the robot is stopped.
collision_monitor:
  ros__parameters:
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_nav
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    enable_stamped_cmd_vel: true
    transform_tolerance: 0.3
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["SlowZone", "FootprintApproach"]
    SlowZone:
      type: circle
      radius: 0.6
      action_type: slowdown
      slowdown_ratio: 0.5
      min_points: 4
      visualize: true
      polygon_pub_topic: collision_monitor/slow_zone
      enabled: true
    FootprintApproach:
      type: polygon                   # the robot's footprint (as the costmaps), 30 x 22 cm + 1 cm
      points: "[[0.16, 0.12], [0.16, -0.12], [-0.16, -0.12], [-0.16, 0.12]]"
      action_type: approach
      min_points: 4
      time_before_collision: 1.2
      simulation_time_step: 0.1
      visualize: true
      polygon_pub_topic: collision_monitor/footprint
      enabled: true
    observation_sources: ["candidates"]
    candidates:
      type: pointcloud
      topic: /camera/obstacle_candidates
      min_height: 0.03                # base_link frame: floor is at -0.004
      max_height: 0.60
      enabled: true
